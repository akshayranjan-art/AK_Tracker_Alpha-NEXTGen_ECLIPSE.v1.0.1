<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse Personal Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b0b14;--card:#15152a;--ac:#e0a526;--ac2:#c2478f;--tx:#eee;--mu:#8a8aa8;--ok:#2ecc71}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#3a1a4d,var(--bg) 55%);color:var(--tx);font:14px system-ui,Arial}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#0008;position:sticky;top:0;z-index:5;flex-wrap:wrap}
h1{font-size:18px;margin:0;color:var(--ac);flex:1;min-width:180px}
button,select,input{background:var(--card);color:var(--tx);border:1px solid #333a;border-radius:8px;padding:7px 11px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--ac)}.p{background:var(--ac);color:#000;font-weight:600}
nav{display:flex;gap:6px;padding:8px 16px;flex-wrap:wrap}nav button.on{background:var(--ac2);border-color:var(--ac2)}
main{padding:0 16px 60px}.w{overflow:auto;max-height:70vh;border-radius:10px;border:1px solid #2a2a4a}
table{border-collapse:collapse;width:100%;min-width:1100px}th{background:var(--ac2);position:sticky;top:0;padding:8px;font-size:12px;white-space:nowrap}
td{border-bottom:1px solid #222;padding:6px 8px;background:#12122299}td[contenteditable]:focus,th[contenteditable]:focus{outline:2px solid var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.c{background:var(--card);border-radius:10px;padding:12px;border:1px solid #2a2a4a}
.c b{color:var(--ac)}.mu{color:var(--mu);font-size:12px}.bar{height:6px;background:#333;border-radius:4px;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
#login,#modal,#adm{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20}
.box{background:var(--card);padding:22px;border-radius:14px;width:min(92vw,360px);display:grid;gap:10px;border:1px solid var(--ac)}
#adm .box{width:min(94vw,560px);max-height:88vh;overflow:auto}#modal .box{width:min(96vw,760px);background:none;border:0;padding:0}
#sl{aspect-ratio:16/9;border-radius:14px;padding:6%;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ok);color:#000;padding:8px 16px;border-radius:20px;display:none;z-index:30}
.hi{background:#2ecc7133}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
</style></head><body>
<div id="login" style="display:flex"><div class="box"><h2 style="margin:0;color:var(--ac)">🌘 Eclipse Login</h2><input id="lu" placeholder="User ID"><input id="lp" type="password" placeholder="Password"><button class="p" onclick="doLogin()">Unlock</button><div class="mu" id="lh"></div></div></div>
<header><h1 id="ttl" contenteditable oninput="S.title=this.textContent;sv()"></h1>
<input id="q" placeholder="Search..." oninput="render()"><select id="sf" onchange="render()"><option value="">All status</option><option>Complete</option><option>In Progress</option><option>Delayed</option><option>Planned</option></select>
<span class="mu" id="sv">●</span><button class="p" onclick="saveNow()">💾 Save</button><button onclick="toXlsx()">📗 Excel</button><button onclick="openAdm()" title="Admin">🛡️ Admin</button></header>
<nav id="nav"></nav><main id="main"></main>
<div id="modal"><div class="box"><div id="sl"></div><div class="row" style="justify-content:center;margin-top:10px"><button onclick="sli(-1)">◀</button><span id="sc" class="mu"></span><button onclick="sli(1)">▶</button><button onclick="modal.style.display='none'">✖ Close</button></div></div></div>
<div id="adm"><div class="box" id="ab"></div></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),K='ecl_main',D=new Date().toISOString().slice(0,10);
const COLS=[['id','Idea ID'],['ver','Version'],['hod','HOD'],['loc','Location'],['cat','Category'],['start','Start'],['end','Deployed'],['hrs','Time to develop'],['proc','Process'],['annual','Annual Hrs Saved'],['man','Manual Effort'],['aft','After Impl.'],['saved','Saved min'],['users','Users'],['status','Status'],['bet','Big Bet'],['idea','Idea Generator'],['prog','Progress %']];
let S=JSON.parse(localStorage.getItem(K)||'null')||{title:'🌘 My Personal Eclipse Tracker',cols:COLS.map(c=>({k:c[0],t:c[1]})),rows:[],servers:Array.from({length:200},(_,i)=>({n:'SRV-'+String(i+1).padStart(3,'0'),url:'http://localhost:'+(3000+i)+'/save'})),active:-1,auth:{lock:false,u:'admin',p:'admin'},tab:'t'};
let admin=false,tab=S.tab||'t';
const DOM=['Audit','Claims','Provider','Rate Match','Excel','PDF','Dashboard','Email','Data Quality','Reporting'],ACT=['Auto Checker','Bulk Loader','Smart Tracker','Alert Bot','Name Finder','Report Builder','Duplicate Cleaner','Validation Engine','AI Summarizer','Workflow Scheduler'];
const IDEAS=Array.from({length:100},(_,i)=>DOM[Math.floor(i/10)]+' '+ACT[i%10]);
function sv(){clearTimeout(sv.t);$('sv').textContent='● unsaved';sv.t=setTimeout(saveNow,1500)}
function saveNow(){S.tab=tab;const j=JSON.stringify(S);localStorage.setItem(K,j);localStorage.setItem('ecl_bk_'+D,j);
Object.keys(localStorage).filter(k=>k.startsWith('ecl_bk_')).sort().slice(0,-15).forEach(k=>localStorage.removeItem(k));
$('sv').textContent='● saved '+new Date().toLocaleTimeString();
const s=S.servers[S.active];if(s){fetch(s.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:j}).then(()=>toast('Server '+s.n+' ko bheja'),()=>toast('Server fail, local save ok'))}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function toXlsx(){const wb=XLSX.utils.book_new();const r=S.rows.map(o=>Object.fromEntries(S.cols.map(c=>[c.t,o[c.k]||''])));
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),'Tracker');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(IDEAS.map((x,i)=>({No:i+1,Idea:x,Added:S.rows.some(o=>o.cat===x)?'Yes':''}))),'Ideas');
XLSX.writeFile(wb,'Eclipse_Tracker_'+D+'.xlsx')}
function doLogin(){const a=S.auth;if(!a.lock||($('lu').value==a.u&&$('lp').value==a.p)){admin=!a.lock||$('lu').value==a.u;$('login').style.display='none';render()}else $('lh').textContent='Galat ID/Password'}
function nav(){const T=[['t','📋 Tracker'],['i','💡 100 Ideas'],['s','🖥️ 200 Servers'],['d','📊 Dashboard']];$('nav').innerHTML=T.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}
function render(){$('ttl').textContent=S.title;nav();const m=$('main');
if(tab=='t'){const q=$('q').value.toLowerCase(),f=$('sf').value;
m.innerHTML=`<div class="row" style="margin-bottom:8px"><button class="p" onclick="addRow()">➕ New Row</button></div><div class="w"><table><tr><th>#</th>${S.cols.map((c,i)=>`<th contenteditable oninput="S.cols[${i}].t=this.textContent;sv()">${c.t}</th>`).join('')}<th>✖</th></tr>`+
S.rows.map((o,r)=>({o,r})).filter(x=>(!f||x.o.status==f)&&(!q||JSON.stringify(x.o).toLowerCase().includes(q))).map(({o,r})=>`<tr><td>${r+1}</td>${S.cols.map(c=>c.k=='status'?`<td><select onchange="S.rows[${r}].status=this.value;sv()">${['Planned','In Progress','Complete','Delayed'].map(v=>`<option ${o.status==v?'selected':''}>${v}</option>`).join('')}</select></td>`:`<td contenteditable oninput="S.rows[${r}]['${c.k}']=this.textContent;sv()">${o[c.k]||''}</td>`).join('')}<td><button onclick="S.rows.splice(${r},1);sv();render()">🗑</button></td></tr>`).join('')+'</table></div>'}
if(tab=='i')m.innerHTML=`<p class="mu">Har idea ka apna alag PPT design. 📽️ dabao, ➕ se tracker mein daalo.</p><div class="g">`+IDEAS.map((x,i)=>`<div class="c"><b>#${i+1}</b> ${x}<div class="row" style="margin-top:8px"><button onclick="deck(${i})">📽️ PPT</button><button onclick="addIdea(${i})">➕ Track</button></div></div>`).join('')+'</div>';
if(tab=='s')m.innerHTML=`<p class="mu">Active: ${S.servers[S.active]?S.servers[S.active].n:'none (sirf local + Excel)'} — Save dabane par data JSON POST hota hai active server par.</p><div class="w"><table style="min-width:600px"><tr><th>Name</th><th>URL (edit)</th><th>Action</th></tr>`+S.servers.map((s,i)=>`<tr class="${S.active==i?'hi':''}"><td contenteditable oninput="S.servers[${i}].n=this.textContent;sv()">${s.n}</td><td contenteditable oninput="S.servers[${i}].url=this.textContent;sv()">${s.url}</td><td><button onclick="S.active=${i};sv();render()">🔌 Connect</button><button onclick="ping(${i})">Ping</button></td></tr>`).join('')+'</table></div>';
if(tab=='d'){const R=S.rows,n=k=>R.reduce((a,o)=>a+(parseFloat(o[k])||0),0),done=R.filter(o=>o.status=='Complete').length;
m.innerHTML=`<div class="g">${[['Total Tools',R.length],['Complete',done],['Annual Hrs Saved',n('annual')],['Saved Min',n('saved')],['Users',n('users')],['Done %',R.length?Math.round(done*100/R.length):0]].map(x=>`<div class="c mu">${x[0]}<div style="font-size:28px;color:var(--ac)">${x[1]}</div></div>`).join('')}</div>`}}
function addRow(){const o={};S.cols.forEach(c=>o[c.k]='');o.status='Planned';o.start=D;S.rows.push(o);sv();render()}
function addIdea(i){const o={};S.cols.forEach(c=>o[c.k]='');Object.assign(o,{id:'IDEA-'+(i+1),ver:'v'+(S.rows.length+1)+'.0',cat:IDEAS[i],status:'Planned',start:D,bet:'MEDIUM',prog:'0'});S.rows.push(o);sv();toast('Tracker mein add');}
function ping(i){const t=Date.now();fetch(S.servers[i].url,{mode:'no-cors'}).then(()=>toast('Online '+(Date.now()-t)+'ms'),()=>toast('Offline'))}
let cur=0,ci=0;function deck(i){cur=i;ci=0;$('modal').style.display='flex';sli(0)}
function sli(d){ci=Math.min(3,Math.max(0,ci+d));const i=cur,h=(i*3.6)%360,F=['Georgia','Impact','Trebuchet MS','Courier New','Verdana','Palatino'][i%6],L=i%5,a=`hsl(${h},70%,45%)`,b=`hsl(${(h+60)%360},70%,25%)`,x=IDEAS[i];
const BG=[`linear-gradient(135deg,${a},${b})`,`#111`,`linear-gradient(${i*7}deg,${b},#000)`,`radial-gradient(circle,${a},${b})`,`#f4f1ea`][L],C=L==4?'#222':'#fff',AC=L==4?a:`hsl(${(h+180)%360},90%,70%)`;
const S4=[`<h1 style="font-size:34px;margin:0;color:${AC}">${x}</h1><p>Personal Tool Proposal • Idea #${i+1}</p>`,`<h2 style="color:${AC}">Problem → Solution</h2><p>Manual ${x.split(' ')[0]} kaam slow hai.<br>${x} se automatic aur accurate.</p>`,`<h2 style="color:${AC}">Impact</h2><p style="font-size:26px">⏱ ${20+i%50} min saved/run<br>👥 ${5+i%30} users • 📈 ${60+i%40}% less effort</p>`,`<h2 style="color:${AC}">Roadmap</h2><p>Week 1 Build → Week 2 Test → Week 3 Deploy → Track</p>`];
const s=$('sl');s.style.cssText=`background:${BG};color:${C};font-family:${F};border:${L==1?'4px solid '+a:'0'};text-align:${i%2?'left':'center'}`;s.innerHTML=S4[ci];$('sc').textContent=`Design ${i+1}/100 • ${ci+1}/4`}
function openAdm(){if(S.auth.lock&&!admin){toast('Admin login chahiye');return}
$('adm').style.display='flex';const bk=Object.keys(localStorage).filter(k=>k.startsWith('ecl_bk_')).sort().reverse();
$('ab').innerHTML=`<h3 style="margin:0;color:var(--ac)">🛡️ Admin</h3>
<label><input type="checkbox" ${S.auth.lock?'checked':''} onchange="S.auth.lock=this.checked;sv()"> Login lock ON (abhi OFF = unlock)</label>
<div class="row"><input id="au" value="${S.auth.u}" placeholder="admin id"><input id="ap" value="${S.auth.p}" placeholder="password"><button onclick="S.auth.u=au.value;S.auth.p=ap.value;sv();toast('Updated')">Set</button></div>
<div class="row"><button onclick="S.cols.push({k:'c'+Date.now(),t:'New Column'});sv();render()">➕ Column</button><button onclick="S.cols.pop();sv();render()">➖ Last Column</button><button onclick="if(confirm('Sab reset?')){localStorage.removeItem('${K}');location.reload()}">⚠ Reset</button></div>
<b>Backups (15 din, roz auto)</b>${bk.map(k=>`<div class="row"><span>${k.slice(7)}</span><button onclick="S=JSON.parse(localStorage.getItem('${k}'));saveNow();location.reload()">Restore</button></div>`).join('')}
<button onclick="$('adm').style.display='none'">Close</button>`}
render();$('lh').textContent=S.auth.lock?'':'Abhi unlock hai: kuch bhi daal ke Unlock dabao';
</script></body></html>
